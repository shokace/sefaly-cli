# CI workflow — vet + build + race-enabled tests on every push to
# main and every PR.
#
# Third-party actions pinned to commit SHAs (not floating tags) to
# defend against tag-repoint attacks. Same bump procedure as in
# release.yml. Keep these two files in sync when bumping a shared
# action.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.x'
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build -trimpath -o sef .
      - name: Test
        run: go test -race -count=1 ./...
