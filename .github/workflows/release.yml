# Release workflow for sef.
#
# Fires when a tag matching v*.*.* is pushed (e.g. `v0.1.0`,
# `v1.2.3-beta.1`). Runs GoReleaser, which:
#   1. Builds the cross-platform matrix defined in .goreleaser.yaml
#      (linux/darwin/windows × amd64/arm64).
#   2. Bakes the tag into the `sef --version` output via ldflags.
#   3. Packages each platform as a tarball (zip on Windows) with
#      LICENSE, README, SECURITY alongside the binary.
#   4. Computes SHA-256 for every artifact into sha256sums.txt.
#   5. Creates a GitHub Release with the autogenerated changelog
#      from commit subjects, uploads all assets.
#
# Permissions: `contents: write` is needed for GoReleaser to create
# the Release and upload assets. Nothing else.
#
# To cut a release:
#   git tag -a v0.1.0 -m "First public release"
#   git push origin v0.1.0
#
# Then watch the workflow in the Actions tab.

name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history is required so GoReleaser can autogenerate
          # the changelog from commit messages between tags.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          # GITHUB_TOKEN is injected automatically by Actions and is
          # what GoReleaser uses to create the Release + upload assets.
          # Scope is limited to this repo, expires when the job ends.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
