# Release workflow for sef.
#
# Fires when a tag matching v*.*.* is pushed (e.g. `v0.1.0`,
# `v1.2.3-beta.1`). Runs GoReleaser, which:
#   1. Builds the cross-platform matrix defined in .goreleaser.yaml
#      (linux/darwin/windows × amd64/arm64).
#   2. Bakes the tag into the `sef --version` output via ldflags.
#   3. Packages each platform as a tarball (zip on Windows) with
#      LICENSE, README, SECURITY alongside the binary.
#   4. Computes SHA-256 for every artifact into sha256sums.txt.
#   5. Signs sha256sums.txt with cosign keyless (OIDC token from
#      this workflow). Produces sha256sums.txt.sig + .pem and logs
#      the signature to the Rekor public transparency log.
#   6. Creates a GitHub Release with the autogenerated changelog
#      from commit subjects, uploads all assets.
#
# Permissions:
#   contents: write   — GoReleaser creates the Release + uploads assets.
#   id-token: write   — cosign keyless needs the OIDC token to request
#                       a short-lived signing certificate from Fulcio.
#                       Without this, sign-blob fails with a 403.
#
# Third-party actions are pinned to specific commit SHAs (not floating
# major-version tags) to defend against tag-repoint supply-chain
# attacks. Inline comments record the human-readable version the SHA
# corresponds to so Renovate / dependabot / a human reviewer can keep
# them current. Bump procedure:
#   1. Look up the new tag's commit SHA: git ls-remote <repo> <tag>
#   2. Update the SHA and the `# v...` comment together.
#
# To cut a release:
#   git tag -a v0.1.0 -m "First public release"
#   git push origin v0.1.0
#
# Then watch the workflow in the Actions tab.

name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Full history is required so GoReleaser can autogenerate
          # the changelog from commit messages between tags.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26'
          cache: true

      - name: Install cosign
        uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          # GITHUB_TOKEN is injected automatically by Actions and is
          # what GoReleaser uses to create the Release + upload assets.
          # Scope is limited to this repo, expires when the job ends.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
