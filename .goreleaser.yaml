# GoReleaser config for `sef`.
#
# Tag a release locally + push the tag:
#   git tag -a v0.1.0 -m "First release"
#   git push origin v0.1.0
#
# The .github/workflows/release.yml workflow picks up the tag and
# runs `goreleaser release --clean`, which builds the matrix, signs
# the checksums file with cosign (keyless, via GitHub OIDC), and
# publishes a GitHub Release with the tarballs + .sig + .pem.
#
# Local dry-run (no upload, no tag required):
#   goreleaser release --snapshot --clean --skip=publish
#
# Verify config:  goreleaser check

version: 2

project_name: sef

before:
  hooks:
    - go mod tidy

builds:
  - id: sef
    main: .
    binary: sef
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      # -s -w strips the symbol table + DWARF info, ~30% smaller binary.
      # The -X injection replaces the `dev` default in
      # internal/cli/root.go so `sef --version` reports the tag.
      - -s -w
      - -X github.com/shokace/sefaly-cli/internal/cli.Version=v{{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    # Linux/macOS get both arches. Windows/arm64 is rare in the wild
    # but cheap to produce, so include it.

archives:
  - id: sef-archive
    # Tarball naming. Install.sh parses the GitHub release API to find
    # the right asset, so the exact filename isn't load-bearing, but
    # keep it predictable: sef_<version>_<os>_<arch>.<ext>.
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md
      - SECURITY.md

checksum:
  name_template: sha256sums.txt
  algorithm: sha256

# Keyless cosign signing. Signs sha256sums.txt only (which itself
# transitively covers every artifact via its hashes), so the user
# only has to verify one signature, not 8.
#
# - identity: pulled from the GitHub Actions OIDC token. The
#   resulting certificate's SAN is
#   `https://github.com/shokace/sefaly-cli/.github/workflows/release.yml@refs/tags/v0.1.0`,
#   so verifiers can pin to "must have come from THIS workflow in
#   THIS repo at THIS tag" via cosign's --certificate-identity-regexp
#   and --certificate-oidc-issuer flags.
# - storage: signature is logged to the Rekor transparency log by
#   default — a public, append-only ledger so anyone can spot
#   anomalous signing activity.
# - keyless: no long-lived signing key to leak. The cert is issued
#   for ~10 minutes per release run and never persisted.
#
# Verification (manual):
#   cosign verify-blob \
#     --certificate sha256sums.txt.pem \
#     --signature   sha256sums.txt.sig \
#     --certificate-identity-regexp '^https://github.com/shokace/sefaly-cli/' \
#     --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
#     sha256sums.txt
signs:
  - cmd: cosign
    signature: '${artifact}.sig'
    certificate: '${artifact}.pem'
    args:
      - sign-blob
      - '--output-signature=${signature}'
      - '--output-certificate=${certificate}'
      - '${artifact}'
      - '--yes'
    artifacts: checksum
    output: true

snapshot:
  # Snapshot builds (no tag) get a version like "0.0.1-next-<sha>",
  # useful for `goreleaser release --snapshot` smoke runs.
  version_template: "{{ incpatch .Version }}-next-{{ .ShortCommit }}"

changelog:
  sort: asc
  use: github
  # GoReleaser autogenerates the release notes from commit subjects.
  # Skip housekeeping commits — they're noise in user-facing notes.
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "Merge pull request"
      - "Merge branch"
  groups:
    - title: New features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Other changes
      order: 999

release:
  github:
    owner: shokace
    name: sefaly-cli
  draft: false
  prerelease: auto
  name_template: "{{.Tag}}"
  # A footer that lands on every release page. Points people at the
  # install script + the security policy.
  footer: |
    ## Install

    ```sh
    curl -fsSL https://www.sefaly.com/install.sh | sh
    ```

    `install.sh` verifies the cosign signature on `sha256sums.txt`
    automatically when cosign is on your PATH, and always verifies the
    SHA-256 of the downloaded archive before installing.

    Or download the binary for your platform from the assets above.

    ## Verify the release manually

    Every release is signed with cosign keyless (GitHub Actions OIDC,
    no long-lived key). To verify `sha256sums.txt` came from this
    repo's release workflow:

    ```sh
    cosign verify-blob \
      --certificate sha256sums.txt.pem \
      --signature   sha256sums.txt.sig \
      --certificate-identity-regexp '^https://github.com/shokace/sefaly-cli/' \
      --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
      sha256sums.txt
    ```

    Then verify the binary against the (now-trusted) checksums file:

    ```sh
    sha256sum -c sha256sums.txt --ignore-missing
    ```

    ## Security

    Report vulnerabilities to `security@sefaly.com`. See `SECURITY.md`
    in the repo for the disclosure policy.
